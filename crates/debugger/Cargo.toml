[package]
name = "roast-debugger"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Debug Adapter Protocol (DAP) implementation for Roast"

[dependencies]
roast-common.workspace = true
roast-vm.workspace = true
roast-codegen.workspace = true
roast-runtime.workspace = true

# DAP protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.34", features = ["full"] }

# Channels
crossbeam-channel = "0.5"

# Error handling
thiserror.workspace = true
anyhow = "1.0"

# Logging
tracing = "0.1"

[[bin]]
name = "roast-debug"
path = "src/main.rs"

