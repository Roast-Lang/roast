[package]
name = "async_scraper"
version = "0.1.0"
edition = "2024"
authors = ["Swadhin"]
description = "A multi-threaded async web scraper demonstrating Roast capabilities"
entry = "src/main.roast"

[dependencies]
roast-http = "0.1"
roast-async = "0.1"
roast-threading = "0.1"

[dev-dependencies]
roast-test = "0.1"

[build]
target_dir = "cooked"

[profile.release]
opt_level = "3"
lto = true
