[package]
name = "roast-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Roast crates to fuzz
roast-parser = { path = "../crates/parser" }
roast-common = { path = "../crates/common" }

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_typer"
path = "fuzz_targets/fuzz_typer.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
opt-level = 3
